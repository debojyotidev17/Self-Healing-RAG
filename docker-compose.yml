version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: self_healing_rag_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self_healing_rag_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - RETRIEVAL_MODE=hybrid
      - RERANKER_ENABLED=true
      - CACHE_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: self_healing_rag_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
